version: 0.2.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  cloud_firestore: ^6.10.0
  dio: ^5.7.0
  firebase_auth: ^6.7.0

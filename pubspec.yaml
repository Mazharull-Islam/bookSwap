  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  firebase_auth_mocks: ^0.15.2

name: bookswap_login
description: BookSwap registration, email verification and Google authentication.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  cloud_firestore: ^6.10.0
  dio: ^5.7.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_map: ^8.3.2
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  geolocator: ^14.0.1
  go_router: ^16.2.4
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.2
  timezone: ^0.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  firebase_auth_mocks: ^0.15.2
  fake_cloud_firestore: ^4.3.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
